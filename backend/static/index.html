<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaddleOCR 识别</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f4f6f8; color: #1c1e21; }
  body.dark { background: #121417; color: #e6e8eb; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 18px; background: #1a73e8; color: #fff; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header button { background: rgba(255,255,255,.15); border: 0; color: #fff;
                  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  main { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }
  .drop { border: 2px dashed #9aa4b2; border-radius: 14px; padding: 34px 16px;
          text-align: center; background: #fff; transition: .15s; }
  body.dark .drop { background: #1c1f24; }
  .drop.over { border-color: #1a73e8; background: #eaf2ff; }
  body.dark .drop.over { background: #17253d; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn { border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; cursor: pointer;
         background: #1a73e8; color: #fff; }
  .btn.ghost { background: #e8eaed; color: #333; }
  body.dark .btn.ghost { background: #2a2e34; color: #ddd; }
  .hint { color: #888; font-size: 12.5px; margin-top: 10px; }
  .card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-top: 14px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  body.dark .card { background: #1c1f24; }
  .card h3 { margin: 0 0 6px; font-size: 15px; word-break: break-all; }
  .card .body { display: flex; gap: 12px; align-items: flex-start; }
  .card img.thumb { width: 130px; max-width: 32vw; border-radius: 8px; border: 1px solid rgba(128,128,128,.25);
                    cursor: zoom-in; flex-shrink: 0; }
  .card .result { flex: 1; min-width: 0; }
  .progress { height: 8px; background: #e8eaed; border-radius: 5px; overflow: hidden; margin: 10px 0 2px; }
  body.dark .progress { background: #2a2e34; }
  .progress .bar { height: 100%; width: 0; background: #1a73e8; border-radius: 5px; transition: width .8s linear; }
  .progress .bar.indet { width: 34%; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 66%; } }
  .meta { font-size: 12px; color: #888; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; margin-left: 6px; }
  .queued { background: #fff3cd; color: #8a6d00; }
  .processing { background: #d6e9ff; color: #1053a0; }
  .done { background: #d9f2e2; color: #1c7a3d; }
  .error { background: #fcd9d9; color: #a11c1c; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f4f6f8; border-radius: 8px;
        padding: 12px; font-size: 14px; line-height: 1.6; max-height: 340px; overflow: auto; }
  body.dark pre { background: #121417; }
  .copy { margin-top: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
           align-items: center; justify-content: center; z-index: 9; padding: 20px; }
  .modal.show { display: flex; }
  .modal .box { background: #fff; border-radius: 14px; padding: 22px; max-width: 360px; width: 100%; }
  body.dark .modal .box { background: #1c1f24; }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal .fname { color: #888; font-size: 12.5px; margin-bottom: 14px; word-break: break-all; }
  .modal .btn { width: 100%; margin-top: 10px; }
  .modes { display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
<header>
  <h1>📷 PaddleOCR 文字识别</h1>
  <button onclick="toggleDark()">🌙</button>
</header>
<main>
  <div class="drop" id="drop">
    <div style="font-size:38px">🖼️</div>
    <div id="dropText">拖拽图片到这里，或</div>
    <div class="btns">
      <button class="btn" onclick="pick(false)">选择图片</button>
      <button class="btn ghost" onclick="pick(true)">📷 拍照识别</button>
    </div>
    <div class="hint">支持 jpg / png / webp / bmp，单张识别</div>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="camera" accept="image/*" capture="environment" hidden>
  </div>
  <div id="jobs"></div>
</main>
<div class="modal" id="modal">
  <div class="box">
    <h3>选择输出方式</h3>
    <div class="fname" id="mName"></div>
    <div class="modes">
      <button class="btn" onclick="start('text')">📝 转文字 —— 提取可复制文本</button>
      <button class="btn" onclick="start('doc')">📄 转文档 —— 生成可搜索 PDF</button>
    </div>
    <button class="btn ghost" onclick="cancelPick()">取消</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const fmt = t => new Date((t||0)*1000).toLocaleString();
const label = {queued:'排队中', processing:'识别中', done:'完成', error:'失败'};
const pick = cam => (cam ? $('#camera') : $('#file')).click();
$('#file').onchange = e => choose(e.target.files[0]);
$('#camera').onchange = e => choose(e.target.files[0]);
let pendingFile = null;

function choose(file) {
  if (!file) return;
  pendingFile = file;
  $('#mName').textContent = file.name;
  $('#modal').classList.add('show');
}
function start(mode) {
  $('#modal').classList.remove('show');
  if (pendingFile) send(pendingFile, mode);
  pendingFile = null;
}
function cancelPick() {
  $('#modal').classList.remove('show');
  $('#file').value = ''; $('#camera').value = '';
  pendingFile = null;
}

const drop = $('#drop');
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => send(e.dataTransfer.files[0]));

async function send(file, mode = 'text') {
  if (!file) return;
  $('#dropText').textContent = '上传中: ' + file.name;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('mode', mode);
  try {
    await fetch('/api/upload', {method:'POST', body: fd});
    refresh();
  } finally {
    $('#dropText').textContent = '拖拽图片到这里，或';
    $('#file').value = ''; $('#camera').value = '';
  }
}

async function refresh() {
  const jobs = await (await fetch('/api/jobs')).json();
  const now = Date.now()/1000;
  $('#jobs').innerHTML = jobs.map(j => {
    let prog = '';
    if (j.status === 'queued') {
      const pct = j.position ? Math.max(4, 100 - j.position*12) : 4;
      prog = `<div class="progress"><div class="bar" style="width:${pct}%"></div></div>
              <div class="meta">排队中 · 前面还有 ${Math.max(0,(j.position||1)-1)} 个任务</div>`;
    } else if (j.status === 'processing') {
      const el = Math.max(0, Math.round(now - (j.started_at||now)));
      prog = `<div class="progress"><div class="bar indet"></div></div>
              <div class="meta">识别中 · 已进行 ${el>=60?Math.floor(el/60)+'分'+el%60+'秒':el+'秒'}</div>`;
    }
    const err = j.status==='error' ? `<div class="meta" style="color:#c0392b">${esc(j.error||'识别失败')}</div>` : '';
    const thumb = j.has_image ? `<img class="thumb" src="/api/image/${j.id}" onclick="window.open(this.src)" alt="">` : '';
    const result = j.status==='done' ? `
        <pre id="t-${j.id}">${esc(j.text ?? '')}</pre>
        <div class="btns" style="justify-content:flex-start">
          <button class="btn ghost copy" onclick="copyTxt('${j.id}')">复制文本</button>
          ${j.mode==='doc' ? `<a class="btn" style="text-decoration:none" href="/api/job/${j.id}/pdf">下载 PDF</a>` : ''}
        </div>` : '';
    return `
    <div class="card" data-id="${j.id}">
      <h3>${esc(j.name)} <span class="badge ${j.status}">${label[j.status]}</span></h3>
      <div class="meta">${fmt(j.created_at)}</div>
      ${prog}${err}
      <div class="body">${thumb}<div class="result">${result}</div></div>
    </div>`;
  }).join('');
}

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function copyTxt(id){navigator.clipboard.writeText($('#t-'+id).textContent);}
function toggleDark(){document.body.classList.toggle('dark');
  localStorage.dark=document.body.classList.contains('dark');}
if(localStorage.dark) document.body.classList.add('dark');

refresh();
let wasActive = true;   // 首次先刷一遍
const timer = setInterval(async () => {
  const jobs = await (await fetch('/api/jobs')).json();
  const active = jobs.some(j => j.status==='queued' || j.status==='processing');
  if (active || wasActive) refresh();   // 有活动任务时刷新；任务全部结束后再补刷一次收尾
  wasActive = active;
}, 2000);
</script>
</body>
</html>
